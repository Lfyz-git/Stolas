name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Check installer shell syntax
        run: |
          for script in bootstrap.sh install.sh tools/install-docker.sh; do
            bash -n "$script"
          done
      - run: node tests/workflow.test.cjs
      - name: Import workflows in pinned n8n 2.x
        run: |
          mkdir -p /tmp/stolas-workflows
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.install import ROOT, workflow
          for mode in ('alerts_only', 'every_measurement', 'daily_summary'):
              data = workflow(ROOT, dict(endpoint='http://127.0.0.1:8080', chat_id='123', hours=3, timezone='Etc/UTC', notification_mode=mode, summary_hour=9))
              data['id'] = mode.replace('_', '')
              Path('/tmp/stolas-workflows/' + mode + '.json').write_text(json.dumps(data))
          PY
          docker run --rm --network none -e N8N_ENCRYPTION_KEY=ci-only-not-deployed-key -e N8N_DIAGNOSTICS_ENABLED=false -v /tmp/stolas-workflows:/fixtures:ro docker.n8n.io/n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a import:workflow --separate --input=/fixtures
      - run: python3 -m agent validate --config config/example.json
      - run: docker build --tag stolas:ci .
      - name: Discover real Docker networks and verify access from n8n
        env:
          STOLAS_DOCKER_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -p test_environment.py -v
      - name: Tests with real iperf3 inside the production image
        run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v "$PWD/tests:/tests:ro" --entrypoint python3 stolas:ci -m unittest discover -s /tests -v
      - name: Validate Compose
        env:
          STOLAS_API_TOKEN: ci-placeholder-never-used-as-a-deployed-secret
        run: docker compose config --quiet
