
name: Codex Issue Automation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      allowed: ${{ steps.access.outputs.allowed }}

    steps:
      - name: Check issue author permissions
        id: access
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;

            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author
              });

            const permission = result.data.permission;
            const allowed =
              ['write', 'maintain', 'admin'].includes(permission);

            core.setOutput('allowed', String(allowed));

            core.info(
              `Issue #${context.issue.number}: ` +
              `author=${author}, permission=${permission}, ` +
              `allowed=${allowed}`
            );

  authorized:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Authorization confirmed
        run: echo "Issue author is authorized to run Codex."
