
name: Codex Queue Notifications

on:
  workflow_run:
    workflows:
      - Codex Issue Automation
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check queue and notify
        uses: actions/github-script@v8
        env:
          WEBHOOK_URL: ${{ secrets.STOLAS_QUEUE_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.STOLAS_QUEUE_WEBHOOK_AUTH }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'codex-issues.yml';
            const eventRun = context.payload.workflow_run;

            if (!eventRun || eventRun.status !== 'completed') {
              core.info('Not a completed workflow run.');
              return;
            }

            const activeStatuses = [
              'queued',
              'in_progress',
              'waiting',
              'pending',
              'requested'
            ];

            let activeCount = 0;

            for (const status of activeStatuses) {
              const response =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id,
                  status,
                  per_page: 1
                });

              activeCount += response.data.total_count;
            }

            core.info(`Active or queued runs: ${activeCount}`);

            if (activeCount > 0) {
              core.info('Queue is not empty.');
              return;
            }

            // Only the most recently completed run
            // may generate a queue-empty notification.
            const completed =
              await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                status: 'completed',
                per_page: 100
              });

            const runs = completed.data.workflow_runs;

            runs.sort((a, b) => {
              const timeA = Date.parse(a.updated_at);
              const timeB = Date.parse(b.updated_at);
              return timeB - timeA || b.id - a.id;
            });

            const latestRun = runs[0];

            if (!latestRun) {
              core.info('No completed runs found.');
              return;
            }

            core.info(`Event run: ${eventRun.id}`);
            core.info(`Latest completed run: ${latestRun.id}`);

            if (eventRun.id !== latestRun.id) {
              core.info('A newer completion exists.');
              return;
            }

            const url = process.env.WEBHOOK_URL;
            const auth = process.env.WEBHOOK_AUTH;

            if (!url || !auth) {
              core.setFailed('Webhook secrets are missing.');
              return;
            }

            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'stolas-codex-queue-git-cred': auth
              },
              body: JSON.stringify({
                event: 'queue_empty',
                source: 'github-actions',
                repository: `${owner}/${repo}`,
                latest_run_id: eventRun.id,
                conclusion: eventRun.conclusion,
                timestamp: new Date().toISOString()
              }),
              signal: AbortSignal.timeout(15000)
            });

            if (!response.ok) {
              core.setFailed(
                `Webhook returned HTTP ${response.status}`
              );
              return;
            }

            core.info('Queue-empty event sent to n8n.');
