<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1560" viewBox="0 0 1020 1560" role="img" aria-label="Пример диалога установки Stolas">
<rect width="1020" height="1560" fill="#0f172a"/>
<g font-family="monospace" font-size="16">
<text x="24" y="30" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="50" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="70" fill="#67e8f9" xml:space="preserve">STOLAS · Проверка системы</text>
<text x="24" y="90" fill="#67e8f9" xml:space="preserve">Шаг 1 из 4</text>
<text x="24" y="110" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="130" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="150" fill="#e5e7eb" xml:space="preserve">Каталог: /opt/stolas</text>
<text x="24" y="170" fill="#e5e7eb" xml:space="preserve">Система: Linux; узел: example-node</text>
<text x="24" y="190" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="210" fill="#86efac" xml:space="preserve">Готово: Docker доступен</text>
<text x="24" y="230" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="250" fill="#e5e7eb" xml:space="preserve">Enter — принять. :back — назад; :cancel — отмена.</text>
<text x="24" y="270" fill="#e5e7eb" xml:space="preserve">:rescan — обновить. Ctrl+C — сохранить и выйти.</text>
<text x="24" y="290" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="310" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="330" fill="#67e8f9" xml:space="preserve">STOLAS · Проверка интернет-канала</text>
<text x="24" y="350" fill="#67e8f9" xml:space="preserve">Шаг 2 из 4</text>
<text x="24" y="370" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="390" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="410" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="430" fill="#e5e7eb" xml:space="preserve">Проверять основной канал перед тестами?</text>
<text x="24" y="450" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="470" fill="#e5e7eb" xml:space="preserve">  1. Да, проверять (рекомендуется)</text>
<text x="24" y="490" fill="#e5e7eb" xml:space="preserve">  2. Нет, пропускать проверку</text>
<text x="24" y="510" fill="#67e8f9" xml:space="preserve">Ввод [1]: </text>
<text x="24" y="530" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="550" fill="#e5e7eb" xml:space="preserve">Разрешённые IP (через запятую)</text>
<text x="24" y="570" fill="#e5e7eb" xml:space="preserve">Внешний IPv4 основного подключения или диапазон провайдера.</text>
<text x="24" y="590" fill="#67e8f9" xml:space="preserve">Ввод: 192.0.2.1/32</text>
<text x="24" y="610" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="630" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="650" fill="#67e8f9" xml:space="preserve">STOLAS · Проверьте настройки</text>
<text x="24" y="670" fill="#67e8f9" xml:space="preserve">Шаг 3 из 4</text>
<text x="24" y="690" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="710" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="730" fill="#e5e7eb" xml:space="preserve">Узел: example-node</text>
<text x="24" y="750" fill="#e5e7eb" xml:space="preserve">Измерение: 4 потока, 10 секунд на направление</text>
<text x="24" y="770" fill="#e5e7eb" xml:space="preserve">Основные: spd-rudp.hostkey.ru (По очереди)</text>
<text x="24" y="790" fill="#e5e7eb" xml:space="preserve">Дополнительные: mskst.st.mtsws.net (По очереди)</text>
<text x="24" y="810" fill="#e5e7eb" xml:space="preserve">Аварийные: msk.speed.ruweb.net (По очереди)</text>
<text x="24" y="830" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="850" fill="#e5e7eb" xml:space="preserve">Проверка канала: включена</text>
<text x="24" y="870" fill="#e5e7eb" xml:space="preserve">Разрешённые IP: 192.0.2.1/32</text>
<text x="24" y="890" fill="#e5e7eb" xml:space="preserve">API: http://127.0.0.1:8080</text>
<text x="24" y="910" fill="#e5e7eb" xml:space="preserve">Токен API: сохранён / создан автоматически; скрыт</text>
<text x="24" y="930" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="950" fill="#e5e7eb" xml:space="preserve">Будет запущен Stolas Core. Затем — один тест скорости.</text>
<text x="24" y="970" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="990" fill="#e5e7eb" xml:space="preserve">Что сделать?</text>
<text x="24" y="1010" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1030" fill="#e5e7eb" xml:space="preserve">  1. Установить / применить</text>
<text x="24" y="1050" fill="#e5e7eb" xml:space="preserve">  2. Проверка интернет-канала</text>
<text x="24" y="1070" fill="#e5e7eb" xml:space="preserve">  3. Параметры измерений и серверы</text>
<text x="24" y="1090" fill="#e5e7eb" xml:space="preserve">  4. Доступ к API</text>
<text x="24" y="1110" fill="#e5e7eb" xml:space="preserve">  5. Повторить обнаружение</text>
<text x="24" y="1130" fill="#e5e7eb" xml:space="preserve">  6. Отменить</text>
<text x="24" y="1150" fill="#67e8f9" xml:space="preserve">Ввод [1]: </text>
<text x="24" y="1170" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1190" fill="#86efac" xml:space="preserve">Готово: настройки сохранены</text>
<text x="24" y="1210" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1230" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="1250" fill="#67e8f9" xml:space="preserve">STOLAS · Установка и проверка</text>
<text x="24" y="1270" fill="#67e8f9" xml:space="preserve">Шаг 4 из 4</text>
<text x="24" y="1290" fill="#67e8f9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="1310" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1330" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1350" fill="#86efac" xml:space="preserve">Готово: API отвечает, авторизация проверена</text>
<text x="24" y="1370" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1390" fill="#e5e7eb" xml:space="preserve">Тест скорости (может занять несколько минут)…</text>
<text x="24" y="1410" fill="#e5e7eb" xml:space="preserve">Результат теста: успешно</text>
<text x="24" y="1430" fill="#e5e7eb" xml:space="preserve"></text>
<text x="24" y="1450" fill="#86efac" xml:space="preserve">Готово: Stolas Core запущен</text>
<text x="24" y="1470" fill="#e5e7eb" xml:space="preserve">Токен API сохранён в .env; история — в Docker volume.</text>
<text x="24" y="1490" fill="#e5e7eb" xml:space="preserve">Результаты: /tmp/tmphcaktgkt/stolas history</text>
<text x="24" y="1510" fill="#e5e7eb" xml:space="preserve">Логи: /tmp/tmphcaktgkt/stolas logs</text>
</g>
</svg>
