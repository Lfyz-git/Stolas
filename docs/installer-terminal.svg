<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1400" role="img" aria-label="Пример диалога установки Stolas">
<rect width="100%" height="100%" fill="#111827"/>
<g fill="#e5e7eb" font-family="monospace" font-size="14">
<text x="24" y="30" xml:space="preserve"></text>
<text x="24" y="50" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="70" xml:space="preserve">STOLAS · Проверка системы</text>
<text x="24" y="90" xml:space="preserve">Шаг 1 из 4</text>
<text x="24" y="110" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="130" xml:space="preserve"></text>
<text x="24" y="150" xml:space="preserve">Каталог: /opt/stolas</text>
<text x="24" y="170" xml:space="preserve">Система: Linux; узел: example-node</text>
<text x="24" y="190" xml:space="preserve">Готово: Docker доступен</text>
<text x="24" y="210" xml:space="preserve"></text>
<text x="24" y="230" xml:space="preserve">Enter — принять значение по умолчанию.</text>
<text x="24" y="250" xml:space="preserve"></text>
<text x="24" y="270" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="290" xml:space="preserve">STOLAS · Проверка интернет-канала</text>
<text x="24" y="310" xml:space="preserve">Шаг 2 из 4</text>
<text x="24" y="330" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="350" xml:space="preserve"></text>
<text x="24" y="370" xml:space="preserve">Основной канал: пока не подтверждён</text>
<text x="24" y="390" xml:space="preserve">Разрешённые IP: не заданы</text>
<text x="24" y="410" xml:space="preserve"></text>
<text x="24" y="430" xml:space="preserve">Проверять основной канал перед тестами?</text>
<text x="24" y="450" xml:space="preserve"></text>
<text x="24" y="470" xml:space="preserve">  1. Да, проверять (рекомендуется)</text>
<text x="24" y="490" xml:space="preserve">  2. Нет, пропускать проверку</text>
<text x="24" y="510" xml:space="preserve"></text>
<text x="24" y="530" xml:space="preserve">Ввод [1]: </text>
<text x="24" y="550" xml:space="preserve">Внешний IPv4 основного подключения или диапазон провайдера.</text>
<text x="24" y="570" xml:space="preserve">Например: 203.0.113.10/32. При смене адреса обновите настройку.</text>
<text x="24" y="590" xml:space="preserve">Разрешённые IP (через запятую)</text>
<text x="24" y="610" xml:space="preserve">Ввод: </text>
<text x="24" y="630" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="650" xml:space="preserve">STOLAS · Проверьте настройки</text>
<text x="24" y="670" xml:space="preserve">Шаг 3 из 4</text>
<text x="24" y="690" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="710" xml:space="preserve"></text>
<text x="24" y="730" xml:space="preserve">Узел: example-node</text>
<text x="24" y="750" xml:space="preserve">Измерение: 4 потока, 10 секунд на направление</text>
<text x="24" y="770" xml:space="preserve">Основные: primary.example.test (По очереди)</text>
<text x="24" y="790" xml:space="preserve">Дополнительные: additional.example.test (По очереди)</text>
<text x="24" y="810" xml:space="preserve">Аварийные: emergency.example.test (По очереди)</text>
<text x="24" y="830" xml:space="preserve"></text>
<text x="24" y="850" xml:space="preserve">Проверка канала: включена</text>
<text x="24" y="870" xml:space="preserve">Разрешённые IP: 192.0.2.1/32</text>
<text x="24" y="890" xml:space="preserve">API: http://127.0.0.1:8080</text>
<text x="24" y="910" xml:space="preserve">Токен API: сохранён / создан автоматически; скрыт</text>
<text x="24" y="930" xml:space="preserve"></text>
<text x="24" y="950" xml:space="preserve">Будет запущен Stolas Core.</text>
<text x="24" y="970" xml:space="preserve"></text>
<text x="24" y="990" xml:space="preserve">Что сделать?</text>
<text x="24" y="1010" xml:space="preserve"></text>
<text x="24" y="1030" xml:space="preserve">  1. Установить / применить</text>
<text x="24" y="1050" xml:space="preserve">  2. Проверка интернет-канала</text>
<text x="24" y="1070" xml:space="preserve">  3. Параметры измерений и серверы</text>
<text x="24" y="1090" xml:space="preserve">  4. Доступ к API</text>
<text x="24" y="1110" xml:space="preserve">  5. Отменить</text>
<text x="24" y="1130" xml:space="preserve"></text>
<text x="24" y="1150" xml:space="preserve">Ввод [1]: </text>
<text x="24" y="1170" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="1190" xml:space="preserve">STOLAS · Установка и проверка</text>
<text x="24" y="1210" xml:space="preserve">Шаг 4 из 4</text>
<text x="24" y="1230" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="24" y="1250" xml:space="preserve"></text>
<text x="24" y="1270" xml:space="preserve">Сборка образа — первый запуск может занять несколько минут…</text>
<text x="24" y="1290" xml:space="preserve">Готово: Stolas Core запущен</text>
<text x="24" y="1310" xml:space="preserve">API: http://127.0.0.1:8080</text>
<text x="24" y="1330" xml:space="preserve">Токен API сохранён в .env; история — в Docker volume.</text>
<text x="24" y="1350" xml:space="preserve">Результаты: ./stolas history</text>
<text x="24" y="1370" xml:space="preserve">Логи: ./stolas logs</text>
</g></svg>
