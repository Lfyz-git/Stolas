name: ${STOLAS_PROJECT_NAME:-stolas}
services:
  stolas:
    build:
      context: ${STOLAS_BUILD_CONTEXT:-./.stolas/build}
      args:
        STOLAS_INSTANCE_ID: ${STOLAS_INSTANCE_ID:-development}
    container_name: ${STOLAS_CONTAINER_NAME:-stolas}
    image: ${STOLAS_PROJECT_NAME:-stolas}:0.5.1
    restart: unless-stopped
    # Linux only: route checks must see the host's routes, not a bridge gateway.
    network_mode: host
    environment:
      STOLAS_API_TOKEN: ${STOLAS_API_TOKEN:?Set a random API token in .env}
      STOLAS_LISTEN: ${STOLAS_LISTEN:-127.0.0.1}
      STOLAS_PORT: ${STOLAS_PORT:-8080}
      STOLAS_CONFIG: /app/config/local.json
      STOLAS_DATA_DIR: /data
      STOLAS_LOG_LEVEL: ${STOLAS_LOG_LEVEL:-INFO}
      STOLAS_LOG_FORMAT: ${STOLAS_LOG_FORMAT:-json}
    labels:
      org.stolas.service: core
      org.stolas.instance: ${STOLAS_INSTANCE_ID:-development}
    volumes:
      - ./config/local.json:/app/config/local.json:ro
      - stolas-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  stolas-data:
    external: true
    name: ${STOLAS_DATA_VOLUME:-stolas_stolas-data}
